sonarr:
  web-1080p-v4:
    base_url: !env_var SONARR_URL
    api_key: !env_var SONARR_API_KEY

    include:
      - template: sonarr-quality-definition-series
      - template: sonarr-v4-quality-profile-web-1080p
      - template: sonarr-v4-custom-formats-web-1080p

    custom_formats:
      - trash_ids:
          - 44ccbcbc74506f208973e1463b11705f # WiTH AD
          - c196536ea8122397c5854040d01f2aa7 # WiTH ASL
          - b40dc2e630723745aab9f1b94f4aab74 # WiTH BASL
          - 0aef382c4ed4c5eb5d40109dfd351b72 # WiTH BSL
        assign_scores_to:
          - name: WEB-1080p
            score: -10000

    # Override TRaSH size limits to prefer smaller files (GB/min)
    quality_definition:
      type: series
      qualities:
        # Target: ~1–2GB for typical 45–60 min episodes
        - name: WEBDL-1080p
          min: 15
          preferred: 50
          max: 90
        - name: WEBRip-1080p
          min: 15
          preferred: 50
          max: 90

radarr:
  hd-bluray-web:
    base_url: !env_var RADARR_URL
    api_key: !env_var RADARR_API_KEY

    include:
      - template: radarr-quality-definition-movie
      - template: radarr-quality-profile-hd-bluray-web
      - template: radarr-custom-formats-hd-bluray-web

    custom_formats:
      - trash_ids:
          - 127bdbadcf3e4463a8c707759fbaad75 # WiTH.AD
        assign_scores_to:
          - name: HD Bluray + WEB
            score: -10000
